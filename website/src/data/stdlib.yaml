# The user-facing standard-library catalog.
#
# Native entries mirror `vl-codegen::modules`; source entries mirror the
# embedded modules in `crates/vl-stdlib/src/std`. A module page combines both.

- id: std
  order: 1
  module: std
  summary: Output functions for command-line programs.
  title: std module
  description: Standard output functions for VL programs.
  intro: |
    `std` contains the output functions available on the Naravm target.
    Import the module before calling its functions:
  import_example: |
    use std;

    fun main() {
        std.println("Hello, world!");
    }
  functions:
    - name: print
      params:
        - name: value
          type: String
          detail: Byte string to write. No newline is added.
      returns:
        type: void
      detail: Writes a string to standard output without adding a newline.
      example: |
        std.print("ready");
    - name: println
      params:
        - name: value
          type: String
          detail: Byte string to write.
      returns:
        type: void
      detail: Writes a string to standard output followed by a newline.
      example: |
        std.println("ready");
    - name: print_u64
      params:
        - name: value
          type: u64
          detail: Unsigned integer to write.
      returns:
        type: void
      detail: Writes an unsigned integer to standard output.
      example: |
        std.print_u64(42u64);
  outro: |
    The module has no VL source file; these functions are target-provided.

- id: string
  order: 2
  module: std.string
  source: crates/vl-stdlib/src/std/string.vl
  summary: Native string operations and small VL string helpers.
  title: std.string module
  description: String operations and helpers in the VL standard library.
  intro: |
    `std.string` combines target-provided operations with helpers implemented
    in VL. Import the module before using its qualified names:
  import_example: |
    use std.string;

    fun main() {
        val message = "hello";
        val size = std.string.len(message);
        val empty = std.string.is_empty(message);
    }
  functions:
    - name: len
      params:
        - name: value
          type: String
          detail: String whose byte length should be measured.
      returns:
        type: u64
      detail: Native operation that returns the byte length of a string.
      example: |
        val n = std.string.len("hi");
    - name: concat
      params:
        - name: a
          type: String
          detail: First string.
        - name: b
          type: String
          detail: Second string.
      returns:
        type: String
      detail: Native operation that concatenates two byte strings.
    - name: eq
      params:
        - name: a
          type: String
          detail: First string.
        - name: b
          type: String
          detail: Second string.
      returns:
        type: bool
      detail: Native operation that compares two byte strings.
    - name: to_u64
      params:
        - name: value
          type: String
          detail: Decimal string to parse.
      returns:
        type: u64
      detail: Native conversion from a decimal byte string to `u64`; invalid input traps.
    - name: hex_to_u64
      params:
        - name: value
          type: String
          detail: Hexadecimal string to parse.
      returns:
        type: u64
      detail: Native conversion from a hexadecimal byte string to `u64`; invalid input traps.
    - name: byte_at
      params:
        - name: value
          type: String
          detail: String whose byte should be read.
        - name: index
          type: u64
          detail: Zero-based byte index.
      returns:
        type: StringError!u8
        detail: Byte at the given index, or a `StringError`.
      detail: Bounds-checked byte read. `OutOfBounds` is returned when the index is outside the string.
      example: |
        val byte = std.string.byte_at("hello", 1u64) catch 0u8;
    - name: slice
      params:
        - name: value
          type: String
          detail: String to slice.
        - name: start
          type: u64
          detail: Inclusive starting byte index.
        - name: end
          type: u64
          detail: Exclusive ending byte index.
      returns:
        type: StringError!String
        detail: The selected byte range, or a `StringError`.
      detail: Bounds-checked byte slice. `OutOfBounds` and `InvalidRange` report invalid endpoints and reversed ranges.
      example: |
        val part = std.string.slice("hello", 1u64, 4u64) catch "";
    - name: is_empty
      params:
        - name: s
          type: String
          detail: String to test.
      returns:
        type: bool
      detail: VL helper returning whether the string has zero bytes.
      example: |
        val empty = std.string.is_empty("hi");
    - name: strings_equal
      params:
        - name: a
          type: String
          detail: First string.
        - name: b
          type: String
          detail: Second string.
      returns:
        type: bool
      detail: VL helper built on the native string equality operation.
      example: |
        val same = std.string.strings_equal("VL", "VL");
  outro: |
    The helpers are implemented in [`string.vl`](https://github.com/Araozu/vl/tree/main/crates/vl-stdlib/src/std/string.vl); the remaining entries are target natives.
  errors:
    - name: StringError
      variants: [OutOfBounds, InvalidRange]
      detail: |
        Checked string operations return this set when an index or range is
        invalid. The VM currently maps multiple bounds statuses to `OutOfBounds`.

- id: math
  order: 3
  module: std.math
  source: crates/vl-stdlib/src/std/math.vl
  summary: Arithmetic native operations and VL numeric helpers.
  title: std.math module
  description: Numeric operations and helpers in the VL standard library.
  intro: |
    `std.math` contains one target native and helpers written in VL.
  import_example: |
    use std.math;

    fun main() {
        val larger = std.math.max_u64(3u64, 8u64);
    }
  functions:
    - name: mod_u64
      params:
        - name: a
          type: u64
          detail: Dividend.
        - name: b
          type: u64
          detail: Non-zero divisor.
      returns:
        type: u64
      detail: Native unsigned remainder operation.
      example: |
        val remainder = std.math.mod_u64(17u64, 5u64);
    - name: max_u64
      params:
        - name: a
          type: u64
          detail: First value.
        - name: b
          type: u64
          detail: Second value.
      returns:
        type: u64
      detail: VL helper returning the larger unsigned integer.
    - name: min_u64
      params:
        - name: a
          type: u64
          detail: First value.
        - name: b
          type: u64
          detail: Second value.
      returns:
        type: u64
      detail: VL helper returning the smaller unsigned integer.
    - name: clamp_u64
      params:
        - name: v
          type: u64
          detail: Value to clamp.
        - name: lo
          type: u64
          detail: Lower bound.
        - name: hi
          type: u64
          detail: Upper bound.
      returns:
        type: u64
      detail: VL helper limiting a value to an inclusive range.
    - name: max_i64
      params:
        - name: a
          type: i64
          detail: First value.
        - name: b
          type: i64
          detail: Second value.
      returns:
        type: i64
      detail: VL helper returning the larger signed integer.
    - name: min_i64
      params:
        - name: a
          type: i64
          detail: First value.
        - name: b
          type: i64
          detail: Second value.
      returns:
        type: i64
      detail: VL helper returning the smaller signed integer.
    - name: abs_i64
      params:
        - name: a
          type: i64
          detail: Signed integer.
      returns:
        type: i64
      detail: VL helper returning the absolute value.
    - name: is_even
      params:
        - name: v
          type: u64
          detail: Unsigned integer to test.
      returns:
        type: bool
      detail: VL helper testing whether a number is even.
    - name: max
      params:
        - name: a
          type: T
          detail: First numeric value.
        - name: b
          type: T
          detail: Second numeric value.
      returns:
        type: T
      detail: Generic VL helper for any `T extends Numeric`.
      example: |
        val larger = std.math.max(3u64, 8u64);
  outro: |
    The helpers are implemented in [`math.vl`](https://github.com/Araozu/vl/tree/main/crates/vl-stdlib/src/std/math.vl).

- id: fmt
  order: 4
  module: std.fmt
  source: crates/vl-stdlib/src/std/fmt.vl
  summary: Formatting helpers built on the target's string conversion native.
  title: std.fmt module
  description: Formatting helpers in the VL standard library.
  intro: |
    `std.fmt` exposes a VL-named helper for converting unsigned integers to
    strings.
  import_example: |
    use std.fmt;

    fun main() {
        val text = std.fmt.u64_to_string(42u64);
    }
  functions:
    - name: u64_to_s
      params:
        - name: value
          type: u64
          detail: Unsigned integer to convert.
      returns:
        type: String
      detail: Target-native unsigned integer to string conversion.
    - name: u64_to_string
      params:
        - name: v
          type: u64
          detail: Unsigned integer to convert.
      returns:
        type: String
      detail: VL helper wrapping `u64_to_s`.
      example: |
        val text = std.fmt.u64_to_string(42u64);
  outro: |
    The helper is implemented in [`fmt.vl`](https://github.com/Araozu/vl/tree/main/crates/vl-stdlib/src/std/fmt.vl).

- id: fs
  order: 5
  module: std.fs
  summary: Native file operations for native targets (not wasm32).
  title: std.fs module
  description: File operations in the VL standard library.
  intro: |
    `std.fs` exposes the file operations available on native targets.
    `read_file` reads an entire file and reports I/O errors as a fallible
    result. Import the module before using its qualified names:

    Native-only: available when running on linux-x86_64. Not available
    in the browser playground (wasm32-freestanding), which has no
    filesystem or socket support.
  import_example: |
    use std.fs;

    fun main() {
        val text = fs.read_file("data.txt") catch "could not read file";
    }
  functions:
    - name: read_file
      params:
        - name: path
          type: String
          detail: Path of the file to read.
      returns:
        type: FsError!String
        detail: File contents, or an `FsError`.
      detail: Native operation that reads the file into a string. Handle failure with `try`, `catch`, or `match`.
      example: |
        val text = fs.read_file("data.txt") catch "";
  outro: |
    The module has no VL source file; this function is target-provided.
    It is unavailable in wasm32-freestanding builds (including the
    browser playground); use a native linux-x86_64 target for file access.
    TCP sockets ([std.net.tcp](/std/tcp)) follow the same native-only rule.
  errors:
    - name: FsError
      variants: [IoError]
      detail: The VM reports one filesystem failure status, mapped to `IoError`.

- id: tcp
  order: 6
  module: std.net.tcp
  summary: Blocking TCP sockets with typed errors (native targets only).
  title: std.net.tcp module
  description: TCP socket operations in the VL standard library.
  intro: |
    `std.net.tcp` exposes blocking TCP operations backed by the VM's native
    `std::net::tcp` module. Every call returns `TcpError!T`: the native
    status becomes a typed error and the result registers become the ok
    payload. Import the module (and the error set, to name it) before use:

    Native-only: freestanding WASM hosts do not register `std::net::tcp`,
    so linked TCP programs need a native host. Handles are opaque `u64`
    values; closing a handle invalidates it. Reads perform one stream read
    of up to `max_bytes` (1-65536); writes may be partial, so resend any
    remainder. Ports are 1-65535 for connections; listeners may bind port 0
    for an ephemeral port. An empty listen address binds `0.0.0.0`.
  import_example: |
    use std.net.tcp;
    use std.net.tcp.{TcpError};

    fun fetch(sock: u64): TcpError!String {
        val #(data, eof) = try tcp.read(sock, 64u64);
        eof;
        return data;
    }
  functions:
    - name: connect
      params:
        - name: host
          type: String
          detail: Hostname or IP literal to connect to.
        - name: port
          type: u64
          detail: Port to connect to (1-65535).
      returns:
        type: TcpError!u64
      detail: Native operation that connects and returns a socket handle.
      example: |
        val sock = tcp.connect("127.0.0.1", 80u64) catch 0u64;
    - name: listen
      params:
        - name: address
          type: String
          detail: IPv4/IPv6 literal to bind, or empty for all interfaces.
        - name: port
          type: u64
          detail: Port to bind, or 0 for an ephemeral port.
        - name: backlog
          type: u64
          detail: Pending-connection queue length.
      returns:
        type: TcpError!#(u64, u64)
      detail: Native operation that binds a listener; returns the listener handle and the bound port.
      example: |
        val #(listener, port) = tcp.listen("", 0u64, 8u64) catch #(0u64, 0u64);
    - name: accept
      params:
        - name: listener
          type: u64
          detail: Listener handle to accept from.
      returns:
        type: TcpError!u64
      detail: Native operation that blocks for the next connection and returns its socket handle.
      example: |
        val sock = tcp.accept(listener) catch 0u64;
    - name: read
      params:
        - name: socket
          type: u64
          detail: Socket handle to read from.
        - name: max_bytes
          type: u64
          detail: Maximum bytes for this read (1-65536).
      returns:
        type: TcpError!#(String, bool)
      detail: Native operation performing one stream read; returns the bytes and whether EOF was reached.
      example: |
        val #(data, eof) = tcp.read(sock, 64u64) catch #("ERR", true);
    - name: write
      params:
        - name: socket
          type: u64
          detail: Socket handle to write to.
        - name: data
          type: String
          detail: Byte string to send (may contain NUL or non-UTF-8 bytes).
      returns:
        type: TcpError!u64
      detail: Native operation that sends bytes; returns how many were written.
      example: |
        val n = tcp.write(sock, "hello") catch 0u64;
    - name: close
      params:
        - name: handle
          type: u64
          detail: Socket or listener handle to close.
      returns:
        type: TcpError!void
      detail: Native operation that closes a handle, invalidating it.
      example: |
        tcp.close(sock) catch std.print("close failed\n");
  outro: |
    The module has no VL source file; these functions are target-provided.
    `TcpError` has one variant per native status: `InvalidArgument`,
    `IoError`, `InvalidHandle`, `WrongHandleKind`, `TooManyHandles`,
    `OutOfMemory`, and `CapabilityUnavailable`. Unavailable in
    wasm32-freestanding builds (including the browser playground); run them
    on linux-x86_64 instead.
  errors:
    - name: TcpError
      variants: [InvalidArgument, IoError, InvalidHandle, WrongHandleKind, TooManyHandles, OutOfMemory, CapabilityUnavailable]
      detail: |
        One variant is provided for each native TCP status code. TCP functions
        return this error set when a socket operation fails.
