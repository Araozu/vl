# VL standard library catalog.
#
# Docs mirror of the compiler-owned extern signatures (`vl-codegen::modules`).
# The compiler enforces these; this file only renders them. Keep them in sync:
# if a signature changes in `crates/vl-codegen/src/lib.rs`, update it here.
# `id` is the URL slug (`/std/<id>`); `order` fixes sidebar order.

- id: std
  order: 1
  module: std
  summary: Output functions for small command-line programs.
  title: std module
  description: Standard output functions for VL programs.
  intro: |
    The `std` module contains the output functions used by the getting-started
    example.

    Import the module before calling it:
  import_example: |
    use std.print;

    function main() {
        print("Hello, world!\n");
    }
  functions:
    - name: print
      params:
        - name: value
          type: String
          detail: Byte string to write. No implicit newline is added.
      returns:
        type: void
      detail: |
        Writes one byte string to standard output. It does not add an implicit newline.

        `std.print` is supported by the Naravm target and currently expects exactly one
        String argument.
      example: |
        print("ready\n");
    - name: println
      params:
        - name: value
          type: String
          detail: Byte string to write. A single trailing newline is added.
      returns:
        type: void
      detail: |
        Writes one byte string to standard output, followed by a newline.
        `println("hi")` prints the same bytes as `print("hi\n")`.

        `std.println` is supported by the Naravm target and currently expects exactly one
        String argument. The VM has no native newline operation, so it lowers
        to two `print` calls (the value, then `"\n"`).
      example: |
        println("ready");
    - name: print_u64
      params:
        - name: value
          type: u64
          detail: Unsigned integer to write.
      returns:
        type: void
      detail: |
        Unsigned integer output. It is checked during general module checking
        (`vl check`), but the current Naravm target does not emit it yet.
  outro: |
    For the current target and command options, see the [CLI reference](/cli).

- id: fs
  order: 2
  module: std.fs
  summary: File-system functions recognized by the language module catalog. Target support is still in progress.
  title: std.fs module
  description: File-system functions in the VL standard library catalog.
  intro: |
    The `std.fs` module reserves the file-system functions available to the
    language. Import individual functions with a grouped import:
  import_example: |
    use std.fs.{open, read};

    function main() {
        let f = open("data.txt");
        let s = read(f);
    }
  functions:
    - name: open
      params:
        - name: path
          type: String
          detail: Byte string path of the file to open.
      returns:
        type: File
      detail: |
        Opens a file, yielding a `File` reference/handle (Naravm `ObjectFile`).

        Fallible at the VM level (`errno`/`0x30`); VL error handling is out of
        scope for now, so the language surface is a plain `File` return. The
        current Naravm target does not emit file-system calls yet.
      example: |
        let f = open("data.txt");
    - name: read
      params:
        - name: file
          type: File
          detail: Open file to read from.
      returns:
        type: String
      detail: |
        Reads from an opened file, yielding a byte string.

        Like `open`, fallible at the VM level but surfaced as a plain `String`
        return until VL gains error handling. Not yet emitted by Naravm.
      example: |
        let s = read(f);
  outro: |
    `File` is a built-in VL reference/handle type mapping to the VM `ObjectFile`;
    it is distinct from user-defined `object` declarations. See [Basics](/docs/basics)
    for the core type list.

- id: string
  order: 3
  module: std.string
  summary: String helpers recognized by the language module catalog. Target support is still in progress.
  title: std.string module
  description: String functions in the VL standard library catalog.
  intro: |
    The `std.string` module holds helpers for measuring byte strings.
    Import the functions you need:
  import_example: |
    use std.string.{len};

    function main() {
        let n = len("hi");
    }
  functions:
    - name: len
      params:
        - name: value
          type: String
          detail: Byte string to measure.
      returns:
        type: u64
      detail: |
        Returns the length of a `String`. Checked during general module checking;
        the current Naravm target does not emit it yet.
      example: |
        let n = len("hi");
  outro: |
    VL strings are byte strings for now. See [Modules and strings](/docs/modules)
    for literal syntax and supported escapes.
