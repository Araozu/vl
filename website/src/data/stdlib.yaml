# VL standard library catalog.
#
# Single source of truth for the `std` docs section: module pages, the
# overview list, and the sidebar are all generated from this file.
# `id` is the URL slug (`/std/<id>`); `order` fixes sidebar order.

- id: std
  order: 1
  module: std
  summary: Output functions for small command-line programs.
  title: std module
  description: Standard output functions for VL programs.
  intro: |
    The `std` module contains the output functions used by the getting-started
    example.

    Import the module before calling it:
  import_example: |
    use std.print;

    function main() {
        print("Hello, world!\n");
    }
  functions:
    - name: print
      params:
        - name: value
          type: string
          detail: Byte string to write. No implicit newline is added.
      returns:
        type: i64
      detail: |
        Writes one byte string to standard output. It does not add an implicit newline.

        `std.print` is supported by the Naravm target and currently expects exactly one
        string argument.
      example: |
        print("ready\n");
    - name: print_u64
      params:
        - name: value
          type: u64
          detail: Unsigned integer to write.
      returns:
        type: i64
      detail: |
        The module catalog reserves `print_u64` for unsigned integer output. It is
        recognized during general module checking, but the current Naravm target does
        not emit it yet.
  outro: |
    For the current target and command options, see the [CLI reference](/cli).

- id: fs
  order: 2
  module: std.fs
  summary: File-system functions recognized by the language module catalog. Target support is still in progress.
  title: std.fs module
  description: File-system functions in the VL standard library catalog.
  intro: |
    The `std.fs` module reserves the file-system functions available to the
    language. Import individual functions with a grouped import:
  import_example: |
    use std.fs.{open, read};
  functions:
    - name: open
      detail: |
        Opens a file. The callable surface is present in the module catalog; the
        current Naravm target does not emit file-system calls yet.
    - name: read
      detail: |
        Reads from an opened file. Like `open`, this function is currently a checked
        language surface rather than a runnable Naravm operation.
  outro: |
    When target support lands, this page will document argument and result types.

- id: string
  order: 3
  module: std.string
  summary: String helpers recognized by the language module catalog. Target support is still in progress.
  title: std.string module
  description: String functions in the VL standard library catalog.
  intro: |
    The `std.string` module reserves helpers for creating and measuring byte
    strings. Import the functions you need:
  import_example: |
    use std.string.{new, len};
  functions:
    - name: new
      detail: |
        Creates a string value. The function is present in the language module
        catalog; its target-specific argument and result behavior is still being
        defined.
    - name: len
      detail: |
        Returns the length of a string. The function is present in the language module
        catalog; the current Naravm target does not emit it yet.
  outro: |
    VL strings are byte strings for now. See the [language guide](/docs/language)
    for literal syntax and supported escapes.
