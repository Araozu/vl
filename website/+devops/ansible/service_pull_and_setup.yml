---
- name: Pull Docker image and write service version file
  become: false
  hosts: all
  vars:
    remote_folder: '{{ _remote_folder }}'
    image_tag: '{{ _image_tag }}'
    full_registry_url: '{{ _full_registry_url }}'
    project_name: '{{ _project_name }}'
    project_service: '{{ _project_service }}'
    project_stage: '{{ _project_stage }}'
    # Dashes are not valid in env var names, so vl-docs -> VL_DOCS.
    env_prefix: '{{ (project_name + "_" + project_service) | upper | replace("-", "_") }}'

  tasks:
    # - name: Pull image
    #   community.docker.docker_image_pull:
    #     name: '{{ full_registry_url }}'
    #     tag: '{{ image_tag }}'

    - name: Create .version file
      copy:
        content: |
          # Generated by Ansible on {{ ansible_date_time.iso8601 }}
          # Environment: {{ project_stage }}
          # Build: {{ image_tag }}

          # Service version
          {{ env_prefix }}_VERSION={{ image_tag }}
          {{ env_prefix }}_REGISTRY_URL={{ full_registry_url }}
        dest: '{{ remote_folder }}/.version.{{ project_service }}'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0600'
