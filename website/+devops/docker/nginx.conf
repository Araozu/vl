server {
    listen 80;
    server_name vl.nara-lang.org;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: do NOT add a `types { ... }` block here. A server-level
    # `types` replaces the image's mime.types table entirely, so every
    # .html/.css/.js file would fall back to application/octet-stream
    # and browsers would download the page instead of rendering it.
    # Stock nginx mime.types already maps wasm -> application/wasm
    # (and the site falls back to ArrayBuffer instantiation otherwise).

    # The Naravm VM served from the host artifact
    # `/var/bin/naravm-luna-ai.wasm` (see docker-compose volume).
    location = /naravm.wasm {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Cross-Origin-Resource-Policy "same-origin";
        access_log off;
        try_files $uri =404;
    }

    # Long-lived cache for static assets.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|webp|avif|ico|ttf|otf|eot|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML should be revalidated so deploys are picked up quickly.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
